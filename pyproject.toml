[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-audit"
version = "0.3.0"
description = "Local Gmail subscription auditor. Mail stays on your machine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abdelrahman Magdi" }]
keywords = ["gmail", "privacy", "local-llm", "subscriptions", "ollama"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Communications :: Email",
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
]

[project.optional-dependencies]
apple = ["mlx", "mlx-lm"]
dev = ["pytest"]

[project.scripts]
gmail-audit = "gmail_audit.cli:main"

[project.urls]
Homepage = "https://github.com/abdelrahmanmagdii/audit-your-gmail"
Repository = "https://github.com/abdelrahmanmagdii/audit-your-gmail"
Issues = "https://github.com/abdelrahmanmagdii/audit-your-gmail/issues"

[tool.setuptools]
packages = ["gmail_audit"]
